name: adrai
version: 1.0.0.0
license: BSD-3-Clause
language: GHC2021

dependencies:
  - array
  - base >= 4.20 && < 4.21
  - aeson
  - async
  - base64
  - bytestring
  - containers
  - crypton
  - directory
  - file-embed
  - filepath
  - fsnotify
  - http-types
  - memory
  - network
  - optparse-applicative
  - process
  - Win32
  - sqlite-simple
  - stm
  - text
  - time
  - toml-parser
  - typed-process
  - unicode-transforms
  - vector
  - wai
  - wai-websockets
  - warp
  - websockets
  - scientific
  - random

library:
  source-dirs: src

executables:
  adrai:
    main: Main.hs
    source-dirs: app
    dependencies: [adrai]
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N]

  # A Criterion-free, one-action executable for GHC attribution profiles.
  # Keep it separate from adrai-bench: profiling changes runtime behaviour and
  # must never become a Criterion timing result.
  adrai-profile:
    main: ProfileMain.hs
    source-dirs:
      - bench
      - test/support
    other-modules:
      - Adrai.Benchmark.CurrentSearch
      - Adrai.Benchmark.ProfileDriver
      - Adrai.Fixture.Prng
      - Adrai.Fixture.Types
      - Adrai.Fixture.QueryMaterialization
      - Adrai.Fixture.RetrievalScale
    dependencies: [adrai]
    ghc-options: [-threaded, -rtsopts, -eventlog, -with-rtsopts=-N1]

tests:
  adrai-test:
    main: Main.hs
    source-dirs:
      - test/default
      - test/unit
      - test/property
      - test/golden
      - test/integration
      - test/support
    dependencies:
      - adrai
      - hedgehog
      - tasty
      - tasty-hedgehog
      - tasty-hunit
      - temporary

  adrai-stress-test:
    main: Main.hs
    source-dirs:
      - test/stress
      - test/e2e
      - test/support
    # The large-repository gate invokes the package-built CLI directly.  This
    # keeps its cache/search assertions at the public executable boundary.
    build-tools: [adrai:adrai]
    dependencies:
      - adrai
      - hedgehog
      - tasty
      - tasty-hedgehog
      - tasty-hunit
      - temporary

  # Keep real-executable cache coverage outside the large-fixture test tree:
  # selecting it must never construct the 2,000-ADR stress corpus.
  adrai-cache-selection-test:
    main: Main.hs
    source-dirs: test/cache-selection
    # The contract invokes the production CLI; declare that internal executable
    # so Stack builds the current component and exposes it to the test process.
    build-tools: [adrai:adrai]
    dependencies:
      - adrai
      - process
      - sqlite-simple
      - tasty
      - tasty-hunit
      - temporary
    # Both the harness and the real CLI child run with one capability.  The
    # component is intentionally isolated from the large support tree.
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N1]

  # A source-level guard for the native benchmark contract.  It is deliberately
  # separate from the ordinary and stress suites: it reads only registration
  # metadata and documentation, never constructs benchmark fixtures or samples.
  adrai-benchmark-registration-test:
    main: Main.hs
    source-dirs: test/benchmark-registration
    dependencies:
      - directory
      - tasty
      - tasty-hunit

benchmarks:
  adrai-bench:
    main: Main.hs
    source-dirs:
      - bench
      - test/support
    other-modules:
      - Adrai.Benchmark.CurrentSearch
      - Adrai.Fixture.Prng
      - Adrai.Fixture.Types
      - Adrai.Fixture.QueryMaterialization
      - Adrai.Fixture.Relevance
      - Adrai.Fixture.RetrievalScale
    dependencies:
      - adrai
      - criterion
      - deepseq
    # The eventlog runtime remains idle for ordinary Criterion timing runs.
    # It is enabled here only so the documented profiling invocation can opt
    # in with +RTS -l and write heap samples to its run directory.
    ghc-options: [-threaded, -rtsopts, -eventlog, -with-rtsopts=-N1]
