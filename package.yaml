name: adrai
version: 1.0.0.0
license: BSD-3-Clause
language: GHC2021

extra-source-files:
  - web/elm.json
  - web/package.json
  - web/package-lock.json
  - web/src/*
  - web/src/**/*
  - web/static/index.html
  - web/static/app.css
  - web/static/bridge.js
  - web/tools/build.mjs
  - web/tools/verify-assets.mjs
  - web/dist/app.js
  - web/dist/provenance.json
  - web/fixtures/*.json
  - web/tests/*.mjs

dependencies:
  - array
  - base >= 4.20 && < 4.21
  - aeson
  - async
  - base64
  - bytestring
  - containers
  - crypton
  - directory
  - file-embed
  - filepath
  - fsnotify
  - http-types
  - memory
  - network
  - optparse-applicative
  - process
  - Win32
  - sqlite-simple
  - stm
  - template-haskell
  - text
  - time
  - toml-parser
  - typed-process
  - unicode-transforms
  - vector
  - wai
  - wai-websockets
  - warp
  - websockets
  - scientific
  - random

library:
  source-dirs: []
  dependencies: [adrai:internal]
  reexported-modules:
    - Adrai.Cli
    - Adrai.CliRunner
    - Adrai.CliTypes
    - Adrai.Compiler
    - Adrai.Compiler.Attribution
    - Adrai.Compiler.CacheSelection
    - Adrai.Compiler.CacheSync
    - Adrai.Compiler.DocumentCache
    - Adrai.Compiler.Snapshot
    - Adrai.Domain
    - Adrai.Explorer
    - Adrai.Explorer.Interactive
    - Adrai.Explorer.Mutation
    - Adrai.Explorer.Render
    - Adrai.Explorer.Types
    - Adrai.Format
    - Adrai.Format.Config
    - Adrai.Format.Document
    - Adrai.Format.Json
    - Adrai.Format.Toml
    - Adrai.Git
    - Adrai.Graph
    - Adrai.History
    - Adrai.Identity
    - Adrai.Integrity
    - Adrai.ManagedPath
    - Adrai.Markdown
    - Adrai.Provenance
    - Adrai.Provenance.Classification
    - Adrai.Provenance.Discovery
    - Adrai.Provenance.Ensure
    - Adrai.Provenance.Git.Lock
    - Adrai.Provenance.Lock
    - Adrai.Provenance.Overlay
    - Adrai.Provenance.Read
    - Adrai.Query
    - Adrai.Relevance
    - Adrai.Repository
    - Adrai.Retrieval
    - Adrai.Scope
    - Adrai.SearchVectorCorpus
    - Adrai.Service
    - Adrai.Service.Mutation
    - Adrai.Service.Compilation
    - Adrai.Service.PostCommitIndex
    - Adrai.Service.Query
    - Adrai.Service.Transaction
    - Adrai.Sqlite
    - Adrai.State
    - Adrai.Types
    - Adrai.Vector
    - Adrai.Web.Api
    - Adrai.Web.Application
    - Adrai.Web.Assets
    - Adrai.Web.Events
    - Adrai.Web.Server
    - Adrai.Web.Security
    - Adrai.Web.Socket
    - Adrai.Web.Watch

internal-libraries:
  internal:
    source-dirs: src
    visibility: private
    # These modules stay implementation-only even within the package.
    other-modules:
      - Adrai.Compiler.CacheLease.Internal
      - Adrai.Compiler.CacheSelection.Internal
      - Adrai.Service.PostCommitIndex.Internal

executables:
  adrai:
    main: Main.hs
    source-dirs: app
    dependencies: [adrai:internal]
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N]

  # A Criterion-free, one-action executable for GHC attribution profiles.
  # Keep it separate from adrai-bench: profiling changes runtime behaviour and
  # must never become a Criterion timing result.
  adrai-profile:
    main: ProfileMain.hs
    source-dirs:
      - bench
      - test/support
    other-modules:
      - Adrai.Benchmark.CurrentSearch
      - Adrai.Benchmark.ProfileDriver
      - Adrai.Fixture.Prng
      - Adrai.Fixture.Types
      - Adrai.Fixture.QueryMaterialization
      - Adrai.Fixture.RetrievalScale
    dependencies: [adrai:internal]
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N1]

tests:
  adrai-test:
    main: Main.hs
    source-dirs:
      - test/default
      - test/unit
      - test/property
      - test/golden
      - test/integration
      - test/web-api
      - test/support
    dependencies:
      - adrai:internal
      - hedgehog
      - tasty
      - tasty-hedgehog
      - tasty-hunit
      - temporary
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N1]

  adrai-stress-test:
    main: Main.hs
    source-dirs:
      - test/stress
      - test/e2e
      - test/support
    # The large-repository gate invokes the package-built CLI directly.  This
    # keeps its cache/search assertions at the public executable boundary.
    build-tools: [adrai:adrai]
    dependencies:
      - adrai:internal
      - hedgehog
      - tasty
      - tasty-hedgehog
      - tasty-hunit
      - temporary
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N1]

  # Keep real-executable cache coverage outside the large-fixture test tree:
  # selecting it must never construct the 2,000-ADR stress corpus.
  adrai-cache-selection-test:
    main: Main.hs
    source-dirs: test/cache-selection
    # The contract invokes the production CLI; declare that internal executable
    # so Stack builds the current component and exposes it to the test process.
    build-tools: [adrai:adrai]
    dependencies:
      - adrai:internal
      - process
      - sqlite-simple
      - tasty
      - tasty-hunit
      - temporary
    # Both the harness and the real CLI child run with one capability.  The
    # component is intentionally isolated from the large support tree.
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N1]

  # A source-level guard for the native benchmark contract.  It is deliberately
  # separate from the ordinary and stress suites: it reads only registration
  # metadata and documentation, never constructs benchmark fixtures or samples.
  adrai-benchmark-registration-test:
    main: Main.hs
    source-dirs: test/benchmark-registration
    dependencies:
      - directory
      - tasty
      - tasty-hunit
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N1]

benchmarks:
  adrai-bench:
    main: Main.hs
    source-dirs:
      - bench
      - test/support
    other-modules:
      - Adrai.Benchmark.CurrentSearch
      - Adrai.Fixture.Prng
      - Adrai.Fixture.Types
      - Adrai.Fixture.QueryMaterialization
      - Adrai.Fixture.Relevance
      - Adrai.Fixture.RetrievalScale
    dependencies:
      - adrai:internal
      - criterion
      - deepseq
    # The RTS provides eventlog support by default; ordinary Criterion timing
    # runs remain idle until the documented profiling invocation opts in with
    # +RTS -l and writes heap samples to its run directory.
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N1]
