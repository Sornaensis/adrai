name: adrai
version: 1.0.0.0
license: BSD-3-Clause
language: GHC2021

dependencies:
  - array
  - base >= 4.20 && < 4.21
  - aeson
  - async
  - base64
  - bytestring
  - containers
  - crypton
  - directory
  - file-embed
  - filepath
  - fsnotify
  - http-types
  - memory
  - network
  - optparse-applicative
  - process
  - Win32
  - sqlite-simple
  - stm
  - text
  - time
  - toml-parser
  - typed-process
  - unicode-transforms
  - vector
  - wai
  - wai-websockets
  - warp
  - websockets
  - scientific
  - random

library:
  source-dirs: src

executables:
  adrai:
    main: Main.hs
    source-dirs: app
    dependencies: [adrai]
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N]

tests:
  adrai-test:
    main: Main.hs
    source-dirs:
      - test
      - test/unit
      - test/property
      - test/golden
      - test/integration
      - test/support
    dependencies:
      - adrai
      - hedgehog
      - tasty
      - tasty-hedgehog
      - tasty-hunit
      - temporary

  adrai-stress-test:
    main: Main.hs
    source-dirs:
      - test/stress
      - test/e2e
      - test/support
    # The large-repository gate invokes the package-built CLI directly.  This
    # keeps its cache/search assertions at the public executable boundary.
    build-tools: [adrai:adrai]
    dependencies:
      - adrai
      - hedgehog
      - tasty
      - tasty-hedgehog
      - tasty-hunit
      - temporary

  # Keep real-executable cache coverage outside the large-fixture test tree:
  # selecting it must never construct the 2,000-ADR stress corpus.
  adrai-cache-selection-test:
    main: Main.hs
    source-dirs: test/cache-selection
    # The contract invokes the production CLI; declare that internal executable
    # so Stack builds the current component and exposes it to the test process.
    build-tools: [adrai:adrai]
    dependencies:
      - adrai
      - process
      - sqlite-simple
      - tasty
      - tasty-hunit
      - temporary
    # Both the harness and the real CLI child run with one capability.  The
    # component is intentionally isolated from the large support tree.
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N1]
