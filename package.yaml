name: adrai
version: 1.0.0.0
license: BSD-3-Clause
language: GHC2021

dependencies:
  - array
  - base >= 4.20 && < 4.21
  - aeson
  - async
  - base64
  - bytestring
  - containers
  - crypton
  - directory
  - file-embed
  - filepath
  - fsnotify
  - http-types
  - memory
  - network
  - optparse-applicative
  - process
  - Win32
  - sqlite-simple
  - stm
  - text
  - time
  - toml-parser
  - typed-process
  - unicode-transforms
  - vector
  - wai
  - wai-websockets
  - warp
  - websockets
  - scientific
  - random

library:
  source-dirs: src

executables:
  adrai:
    main: Main.hs
    source-dirs: app
    dependencies: [adrai]
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N]

tests:
  adrai-test:
    main: Main.hs
    source-dirs:
      - test
      - test/unit
      - test/property
      - test/golden
      - test/integration
      - test/support
    dependencies:
      - adrai
      - hedgehog
      - tasty
      - tasty-hedgehog
      - tasty-hunit
      - temporary

  adrai-stress-test:
    main: Main.hs
    source-dirs:
      - test/stress
      - test/e2e
      - test/support
    # The large-repository gate invokes the package-built CLI directly.  This
    # keeps its cache/search assertions at the public executable boundary.
    build-tools: [adrai:adrai]
    dependencies:
      - adrai
      - hedgehog
      - tasty
      - tasty-hedgehog
      - tasty-hunit
      - temporary
